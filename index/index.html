<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單 POS 系統</title>
</head>
    <body>
    <div id="menu-categories">
        <h2>菜單系列</h2>
        <ul>
            <li><button onclick="showCategory('desserts')">甜點</button></li>
            <li><button onclick="showCategory('coffees')">咖啡</button></li>

    <div id="order-area">

            </div>

        <div id="current-order">
            <h2>目前訂單</h2>
            <ul id="order-list">
                </ul>
            <div id="order-total">

            </div>
        </div>
    </div>
